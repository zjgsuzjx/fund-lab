<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1100" viewBox="0 0 1450 1100"><rect x="0" y="0" width="1450" height="1100" rx="0" fill="#E8EDF5"/><text x="64" y="73" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#17243D" text-anchor="start">边界状态与反馈</text><text x="64" y="111" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start">输入错误在字段附近解释；提交中阻止重复操作；空状态给出下一步。</text><rect x="64" y="175" width="390" height="300" rx="20" fill="#FFFFFF"/><text x="88" y="213" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" fill="#17243D" text-anchor="start">登录失败</text><rect x="88" y="237" width="342" height="54" rx="12" fill="#EAF2FF"/><text x="104" y="271" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#1768E8" text-anchor="start">用户名或密码不正确</text><text x="88" y="325" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">请检查输入后重试，不清空用户名。</text><rect x="88" y="373" width="342" height="48" rx="12" fill="#1768E8"/><text x="259" y="404" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">重新登录</text><rect x="530" y="175" width="390" height="300" rx="20" fill="#FFFFFF"/><text x="554" y="213" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" fill="#17243D" text-anchor="start">注册校验</text><rect x="554" y="237" width="342" height="54" rx="12" fill="#EAF2FF"/><text x="570" y="271" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#1768E8" text-anchor="start">该用户名已被使用</text><text x="554" y="325" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">保留已填写内容，请换一个用户名。</text><rect x="554" y="373" width="342" height="48" rx="12" fill="#1768E8"/><text x="725" y="404" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">修改用户名</text><rect x="996" y="175" width="390" height="300" rx="20" fill="#FFFFFF"/><text x="1020" y="213" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" fill="#17243D" text-anchor="start">买入金额不足</text><rect x="1020" y="237" width="342" height="54" rx="12" fill="#EAF2FF"/><text x="1036" y="271" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#1768E8" text-anchor="start">可用余额不足</text><text x="1020" y="325" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">本次最多可买入 80,000.00 元。</text><rect x="1020" y="373" width="342" height="48" rx="12" fill="#1768E8"/><text x="1191" y="404" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">修改买入金额</text><rect x="64" y="515" width="390" height="300" rx="20" fill="#FFFFFF"/><text x="88" y="553" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" fill="#17243D" text-anchor="start">可卖份额不足</text><rect x="88" y="577" width="342" height="54" rx="12" fill="#EAF2FF"/><text x="104" y="611" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#1768E8" text-anchor="start">超出可赎回份额</text><text x="88" y="665" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">待确认及已冻结份额不可重复卖出。</text><rect x="88" y="713" width="342" height="48" rx="12" fill="#1768E8"/><text x="259" y="744" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">修改卖出份额</text><rect x="530" y="515" width="390" height="300" rx="20" fill="#FFFFFF"/><text x="554" y="553" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" fill="#17243D" text-anchor="start">暂无交易</text><rect x="554" y="577" width="342" height="54" rx="12" fill="#EAF2FF"/><text x="570" y="611" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#1768E8" text-anchor="start">你的第一笔练习还未开始</text><text x="554" y="665" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">买入或卖出后，可在这里查看进度。</text><rect x="554" y="713" width="342" height="48" rx="12" fill="#1768E8"/><text x="725" y="744" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">去发现基金</text><rect x="996" y="515" width="390" height="300" rx="20" fill="#FFFFFF"/><text x="1020" y="553" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" fill="#17243D" text-anchor="start">数据加载失败</text><rect x="1020" y="577" width="342" height="54" rx="12" fill="#EAF2FF"/><text x="1036" y="611" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#1768E8" text-anchor="start">暂时无法获取净值</text><text x="1020" y="665" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">保留历史数据及日期，恢复后重试。</text><rect x="1020" y="713" width="342" height="48" rx="12" fill="#1768E8"/><text x="1191" y="744" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">重新加载</text><text x="64" y="922" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#17243D" text-anchor="start">提交中：按钮显示“正在提交…”并禁用；成功后进入结果页，失败时保留输入。</text><text x="64" y="961" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#17243D" text-anchor="start">撤单：二次确认后执行；超过截止时间显示不可撤销原因，状态刷新后再操作。</text><text x="64" y="1000" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#17243D" text-anchor="start">注册：密码不足 8 位 / 两次输入不一致 / 未阅读说明时，逐项提示，不清空表单。</text></svg>